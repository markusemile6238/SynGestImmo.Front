
<div class="login-container">
  <div class="login-wrapper">

    <div class="info-panel">
      <div class="overlay-content">
        <p class="company-name">Welcome back !</p>
        <div class="welcome-text">
          <p>Nice to see you again into</p>
          <h1>SynGestImmo</h1>
          <div class="divider"></div>
          <h3 class="description">
            The app that brings us closer
          </h3>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-content">
        <h2>Login Account</h2>
        <p class="subtitle">Please enter your login information.</p>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email ID</mat-label>
            <input matInput formControlName="email" type="email">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hideP ? 'password' : 'text'" formControlName="password">
            <button mat-icon-button matSuffix (click)="hideP = !hideP" type="button">
              <mat-icon>{{hideP ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-flat-button color="primary" class="submit-btn" type="submit">
            SignIn
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
