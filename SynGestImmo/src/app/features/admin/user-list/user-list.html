
<h3 class="m-2 text-warning-500">Users managment</h3>

@if(datasource){

<table mat-table [dataSource]="datasource" class="mat-elevation-z8" >

  <ng-container matColumnDef="Id">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800 "
    >{{element.id}}</td>

  </ng-container>

  <ng-container matColumnDef="Username">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800"
    >{{element.username}}</td>
  </ng-container>

  <ng-container matColumnDef="Email">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800"
    >
      <span [class]="element.isEmailConfirmed ? 'text-success-500' : 'text-warning-500'">{{element.email}}</span>
    </td>
  </ng-container>


  <ng-container matColumnDef="UserRef">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800"
    >
      <span>{{element.userRef}}</span>
    </td>
  </ng-container>


  <ng-container matColumnDef="Entity Id">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800"
    >
      <span>{{element.entityId}}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="Role name">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      class=" text-primary-300  bc-primary-800"
    >
      <span>{{element.roleName}}</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" class=" hover:bg-primary-800"></tr>
</table>
}
