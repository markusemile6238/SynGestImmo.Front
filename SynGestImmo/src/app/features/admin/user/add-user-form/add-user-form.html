@if (!isLoading) {


  <h4 class="text-warning-500 mb-4 ">Add new user</h4>
  <form [formGroup]="form" (ngSubmit)="sendForm()" class="d-flex w-full">
    <div class="fields">

      <app-input name="username" type="text"  [control]="form.controls.username" label="Username" />
      <app-input name="email" type="email"  [control]="form.controls.email" label="Email" />
      <app-input name="password" type="password"  [control]="form.controls.password" label="password" />
      <app-input name="confirmPassword" type="password"  [control]="form.controls.confirmPassword" label="Confirm Password" />
      <app-select name="roleId" [control]="form.controls.roleId" selectLabel="Assign a role" label="User role" [options]="roles$"/>


    </div>
    <div>

      <div class="errors-display flex-column w-full align-items-center">
        <app-display-errors [form]="form" [errorMessage]="errorMessage" />

      </div>

    <button class="w-full inline btn btn-xl rounded" type="submit" [disabled]="!form.valid">Send</button>
    </div>

  </form>

}
